<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ name }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #e0e7ff; --panel: #ffffff; --ink: #1e1b4b; --muted: #5a58a0;
  --accent: #6366f1; --on-accent: #ffffff; --line: #1e1b4b; --r: 6px;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  font-family: 'Work Sans', sans-serif;
  background: var(--bg); color: var(--ink);
  display: flex; justify-content: center;
}
.app { width: 100%; max-width: 820px; height: 100%; display: flex; flex-direction: column; padding: 16px; }

header {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px 4px 14px; border-bottom: 2px solid var(--line);
}
h1 { font-size: 1.6rem; line-height: 1.1; }
header p { color: var(--muted); font-size: .92rem; margin-top: 4px; }
#reset {
  font: inherit; font-size: .9rem; cursor: pointer; color: var(--ink);
  background: var(--panel); border: 2px solid var(--line); border-radius: var(--r); padding: 8px 14px;
}

#chat { flex: 1; overflow-y: auto; padding: 18px 4px; display: flex; flex-direction: column; gap: 14px; }
.msg { max-width: 86%; padding: 11px 15px; line-height: 1.55; overflow-wrap: anywhere; white-space: pre-wrap; }
.msg.bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r) var(--r) var(--r) 4px; }
.msg.user { align-self: flex-end; background: var(--accent); color: var(--on-accent); border-radius: var(--r) var(--r) 4px var(--r); }
.msg pre { background: rgba(127,127,127,.18); padding: 8px 10px; border-radius: 6px; overflow-x: auto; }
.msg code { font-family: monospace; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 6px 0 10px; }
.chip {
  font: inherit; font-size: .88rem; cursor: pointer; color: var(--ink);
  background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 7px 13px;
}
.chip:hover, #reset:hover { border-color: var(--accent); }

.row { display: flex; gap: 10px; padding-top: 12px; border-top: 2px solid var(--line); }
textarea {
  flex: 1; resize: none; font: inherit; color: var(--ink); background: var(--panel);
  border: 2px solid var(--line); border-radius: var(--r); padding: 12px;
}
#send {
  font: inherit; font-weight: 700; cursor: pointer; color: var(--on-accent); background: var(--accent);
  border: 2px solid var(--accent); border-radius: var(--r); padding: 0 22px;
}
#send:disabled { opacity: .5; cursor: wait; }
button:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.dots span { display: inline-block; width: 7px; height: 7px; margin-right: 4px; border-radius: 50%; background: var(--muted); animation: blink 1s infinite; }
.dots span:nth-child(2) { animation-delay: .2s; }
.dots span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .dots span { animation: none; } }

/* Layout: line (plain text with side rules) */
body[data-layout="line"] .msg { background: none; border: 0; border-radius: 0; padding: 4px 14px; color: var(--ink); }
body[data-layout="line"] .msg.bot { border-left: 4px solid var(--accent); }
body[data-layout="line"] .msg.user { border-right: 4px solid var(--line); text-align: right; font-weight: 700; }

/* Layout: card (hard outline with offset shadow) */
body[data-layout="card"] .msg { border: 2px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); }
body[data-layout="card"] header, body[data-layout="card"] .row { border-color: var(--ink); }

/* Layout: notebook (ruled paper with Q and A marks) */
body[data-layout="notebook"] #chat {
  background: repeating-linear-gradient(transparent 0 27px, var(--line) 27px 28px);
  border-left: 3px solid var(--accent); padding-left: 14px; gap: 28px;
}
body[data-layout="notebook"] .msg { background: none; border: 0; border-radius: 0; padding: 0 8px; line-height: 28px; max-width: 94%; color: var(--ink); }
body[data-layout="notebook"] .msg.user { align-self: flex-start; font-weight: 700; }
body[data-layout="notebook"] .msg.user::before { content: "Q. "; color: var(--accent); }
body[data-layout="notebook"] .msg.bot::before { content: "A. "; font-weight: 700; color: var(--accent); }

/* Layout: board (dashed chalk outlines) */
body[data-layout="board"] .msg { background: none; border: 2px dashed var(--line); color: var(--ink); }
body[data-layout="board"] .msg.user { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body data-layout="card">
<div class="app">
  <header>
    <div>
      <h1>{{ name }}</h1>
      <p>{{ tagline }}</p>
    </div>
    <button id="reset" type="button">New chat</button>
  </header>

  <main id="chat" aria-live="polite">
    <div class="msg bot">{{ welcome }}</div>
  </main>

  <div class="chips" id="chips">
    {% for s in suggestions %}<button class="chip" type="button">{{ s }}</button>{% endfor %}
  </div>

  <form class="row" id="form">
    <textarea id="input" rows="1" placeholder="Type your study question..." aria-label="Your question"></textarea>
    <button id="send" type="submit">Send</button>
  </form>
</div>

<script>
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("input");
const send = document.getElementById("send");
const chips = document.getElementById("chips");
const welcome = chat.innerHTML;
let history = [];

function format(text) {
  return text
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/```(?:\w+)?\n?([\s\S]*?)```/g, "<pre>$1</pre>")
    .replace(/`([^`\n]+)`/g, "<code>$1</code>")
    .replace(/^#{1,6}\s*(.+)$/gm, "<strong>$1</strong>")
    .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
    .replace(/^\s*[-*] (.+)$/gm, "\u2022 $1");
}

function addMessage(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  if (role === "bot") { div.innerHTML = format(text); } else { div.textContent = text; }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

async function ask(message) {
  chips.hidden = true;
  addMessage("user", message);
  const typing = addMessage("bot", "");
  typing.innerHTML = '<span class="dots"><span></span><span></span><span></span></span>';
  send.disabled = true;

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message, history }),
    });
    const data = await res.json();
    const reply = data.reply || data.error || "Something went wrong.";
    typing.innerHTML = format(reply);
    if (data.reply) {
      history.push({ role: "user", text: message }, { role: "model", text: reply });
    }
  } catch (err) {
    typing.textContent = "Cannot reach the server. Please try again.";
  }

  send.disabled = false;
  chat.scrollTop = chat.scrollHeight;
  input.focus();
}

form.addEventListener("submit", (e) => {
  e.preventDefault();
  const message = input.value.trim();
  if (!message || send.disabled) return;
  input.value = "";
  ask(message);
});

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    form.requestSubmit();
  }
});

chips.addEventListener("click", (e) => {
  if (e.target.classList.contains("chip")) ask(e.target.textContent);
});

document.getElementById("reset").addEventListener("click", () => {
  history = [];
  chat.innerHTML = welcome;
  chips.hidden = false;
  input.focus();
});
</script>
</body>
</html>
